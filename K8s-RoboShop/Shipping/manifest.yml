apiVersion: v1 
kind: ConfigMap
metadata: 
  name: shipping 
  namespace: roboshop 
data: 
  CART_ENDPOINT: "cart:8080" 
  DB_HOST: "mysql"
  
---

apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: shipping
  namespace: roboshop
  labels: 
    project: roboshop
    component: shipping 
    tier: application 
spec: 
  replicas: 1 
  selector: 
    matchLabels: 
      project: roboshop
      component: shipping 
      tier: application
  template: 
    metadata: 
      labels: 
        project: roboshop
        component: shipping 
        tier: application
    spec: 
      containers: 
      - name: shipping 
        image: vijaykammari/shipping:v1
        imagePullPolicy: Always
        envFrom: 
        - configMapRef: 
            name: shipping

--- 

apiVersion: v1 
kind: Service 
metadata:
  name: shipping
  namespace: roboshop
  labels: 
    project: roboshop
    component: shipping 
    tier: application
spec: 
  selector: 
    project: roboshop
    component: shipping 
    tier: application
  ports: 
  - protocol: TCP 
    port: 8080
    targetPort: 8080