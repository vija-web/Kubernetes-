apiVersion: v1 
kind: ConfigMap
metadata: 
  name: catalogue 
  namespace: roboshop 
data: 
  MONGO: "true" 
  MONGO_URL: "mongodb://mongodb:27017/catalogue"
  
---

apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: catalogue
  namespace: roboshop
  labels: 
    project: roboshop
    component: catalogue 
    tier: db 
spec: 
  replicas: 1 
  selector: 
    matchLabels: 
      project: roboshop
      component: catalogue 
      tier: db
  template: 
    metadata: 
      labels: 
        project: roboshop
        component: catalogue 
        tier: db
    spec: 
      containers: 
      - name: catalogue 
        image: vijaykammari/catalogue:v1
        imagePullPolicy: Always

--- 

apiVersion: v1 
kind: Service 
metadata:
  name: catalogue
  namespace: roboshop
  labels: 
    project: roboshop
    component: catalogue 
    tier: db
spec: 
  selector: 
    project: roboshop
    component: catalogue 
    tier: application
  ports: 
  - protocol: TCP 
    port: 8080
    targetPort: 8080