apiVersion: apps/v1
kind: Deployment 
metadata:
  name: mongodb
  namespace: roboshop
  labels:
    project: roboshop
    component: mongodb
    tier: db 
spec:
  replicas: 1
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      tier: db
  template:
    metadata:
      labels:
        project: roboshop
        component: mongodb
        tier: db
    spec:
      containers:
        - name: mongodb
          image: vijaykammari/mongodb:v1
          imagePullPolicy: Always
          livenessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          readinessProbe:
            tcpSocket:
              port: 27017
            initialDelaySeconds: 12
            periodSeconds: 5
            failureThreshold: 1

---
apiVersion: v1 
kind: Service 
metadata:
  name: mongodb
  namespace: roboshop
spec: 
  selector: 
    project: roboshop
    component: mongodb
    tier: db
  ports: 
  - protocol: TCP
    port: 27017 # service port
    targetPort: 27017  #container port