apiVersion: v1
kind: ConfigMap
metadata:
  name: mysqlc
  namespace: roboshop
data:
  MYSQL_ROOT_PASSWORD: "RoboShop@1"

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql
  namespace: roboshop
data:
  my.cnf: |
    [mysqld]
    innodb_redo_log_capacity = 2G

---

# apiVersion: v1
# kind: Secret
# metadata:
#   name: mysql
#   namespace: roboshop
