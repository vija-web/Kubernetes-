
apiVersion: v1
kind: Service
metadata:
  name: frontendpod
  project: roboshop
spec:
  selectors:
    project: roboshop
    component: frontendpod
  ports:
    - protocol: TCP
      port: 80

--- 

apiVersion: v1
kind: apiVersion: v1
kind: Pod
metadata:
  name: nginx
  labels:
    project: roboshop
    component: frontendpod
spec:
  containers:
  - name: nginx
    image: nginx

