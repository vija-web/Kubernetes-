apiVersion: v1 
kind: ConfigMap
metadata: 
  name: catalogue 
  namespace: roboshop 
data: 
  MONGO: "true" 
  MONGO_URL: "mongodb://mongodb:27017/catalogue"

---

apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: catalogue
  namespace: roboshop
  labels: 
    project: roboshop
    component: catalogue 
    tier: application 
spec: 
  replicas: 1 
  selector: 
    matchLabels: 
      project: roboshop
      component: catalogue 
      tier: application
  template: 
    metadata: 
      labels: 
        project: roboshop
        component: catalogue 
        tier: application
    spec: 
      containers: 
      - name: catalogue 
        image: vijaykammari/catalogue:v1
        imagePullPolicy: Always
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 11
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 1
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 1
        envFrom: 
        - configMapRef: 
            name: catalogue

--- 

apiVersion: v1 
kind: Service 
metadata:
  name: catalogue
  namespace: roboshop
  labels: 
    project: roboshop
    component: catalogue 
    tier: application
spec: 
  selector: 
    project: roboshop
    component: catalogue 
    tier: application
  ports: 
  - protocol: TCP 
    port: 8080
    targetPort: 8080

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: catalogue-hpa
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: catalogue
  minReplicas: 1
  maxReplicas: 5 #70 in the real projects
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 5