apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: user
  namespace: roboshop
  labels: 
    project: roboshop
    component: user 
    tier: application 
spec: 
  replicas: {{ .Values.user.replicas }}
  selector: 
    matchLabels: 
      project: roboshop
      component: user 
      tier: application
  template: 
    metadata: 
      labels: 
        project: roboshop
        component: user 
        tier: application
    spec: 
      containers: 
      - name: user 
        image: vijaykammari/user:v1
        imagePullPolicy: Always
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 11
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 1
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 1
        envFrom: 
        - configMapRef: 
            name: user