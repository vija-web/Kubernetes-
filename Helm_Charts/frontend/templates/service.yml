apiVersion: v1 
kind: Service 
metadata:
  name: frontend
  namespace: roboshop
  labels: 
    project: roboshop
    component: frontend 
    tier: frontend
spec: 
  type: LoadBalancer
  selector: 
    project: roboshop
    component: frontend 
    tier: application
  ports: 
  - protocol: TCP 
    port: 80
    targetPort: 8080
