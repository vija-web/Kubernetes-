apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  selector:
    matchLabels:
      project: roboshop
      component: mysql
      tier: db # has to match .spec.template.metadata.labels
  serviceName: "mysql-headless"
  replicas: {{ .Values.mysql.replicas }} # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        project: roboshop
        component: mysql
        tier: db # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: mysql
        image: vijaykammari/mysql:v1
        imagePullPolicy: Always
        envFrom:
          - configMapRef:
              name: mysqlc
        resources:
          requests:
            memory: "400Mi"
            cpu: "400m"
          limits:
            memory: "400Mi"
            cpu: "400m"
        livenessProbe:
          tcpSocket:
            port: {{ .Values.mysql.port }}
          initialDelaySeconds: 61
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 1
        readinessProbe:
          tcpSocket:
            port: {{ .Values.mysql.port }}
          initialDelaySeconds: 60
          periodSeconds: 5
          failureThreshold: 1
        volumeMounts:
        - name: www
          mountPath: /var/lib/mysql/
        - name: mysql-config
          mountPath: /etc/mysql/conf.d/my.cnf 
          subPath: my.cnf
      volumes:
        - name: mysql-config
          configMap:
            name: mysql   
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-sc"
      resources:
        requests:
          storage: 5Gi