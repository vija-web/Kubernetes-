apiVersion: v1 
kind: Service 
metadata:
  name: mysql-headless
  namespace: roboshop
spec: 
  clusterIP: None
  selector: 
    project: roboshop
    component: mysql
    tier: db
  ports: 
  - protocol: TCP
    port: {{ .Values.mysql.port }} # service port
    targetPort: {{ .Values.mysql.port }}  #container port