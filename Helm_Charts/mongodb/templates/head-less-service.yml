apiVersion: v1 
kind: Service 
metadata:
  name: mongodb-headless
  namespace: roboshop
spec: 
  clusterIP: None
  selector: 
    project: roboshop
    component: mongodb
    tier: db
  ports: 
  - protocol: TCP
    port: {{ .Values.mongodb.port }} # service port
    targetPort: {{ .Values.mongodb.port }}  #container port
