apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: roboshop
spec:
  selector:
    matchLabels:
      project: roboshop
      component: mongodb
      tier: db # has to match .spec.template.metadata.labels
  serviceName: "mongodb-headless"
  replicas: {{ .Values.mongodb.replicas }} # by default is 1
  minReadySeconds: 10 # by default is 0
  template:
    metadata:
      labels:
        project: roboshop
        component: mongodb
        tier: db # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: mongodb
        image: "vijaykammari/mongodb:{{ .Values.mongodb.version }}"
        imagePullPolicy: Always
        resources:
          requests:
            memory: "20Mi"
            cpu: "150m"
          limits:
            memory: "128Mi"
            cpu: "300m"
        livenessProbe:
          tcpSocket:
            port: {{ .Values.mongodb.port }}
          initialDelaySeconds: 13
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 1
        readinessProbe:
          tcpSocket:
            port: {{ .Values.mongodb.port }}
          initialDelaySeconds: 12
          periodSeconds: 5
          failureThreshold: 1
        volumeMounts:
        - name: www
          mountPath: /data/db
  volumeClaimTemplates:
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-sc"
      resources:
        requests:
          storage: 1Gi