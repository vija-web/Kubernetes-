apiVersion: v1 
kind: Service 
metadata:
  name: redis-headless
  namespace: roboshop
  labels: 
    project: roboshop
    component: redis 
    tier: db
spec:
  clusterIP: None
  selector: 
    project: roboshop
    component: redis 
    tier: db
  ports: 
  - protocol: TCP 
    port: 6379
    targetPort: 6379