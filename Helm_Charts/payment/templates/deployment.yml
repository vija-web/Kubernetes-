apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: payment
  namespace: roboshop
  labels: 
    project: roboshop
    component: payment 
    tier: application 
spec: 
  replicas: {{ .Values.payment.replicas }} 
  selector: 
    matchLabels: 
      project: roboshop
      component: payment 
      tier: application
  template: 
    metadata: 
      labels: 
        project: roboshop
        component: payment 
        tier: application
    spec: 
      containers: 
      - name: payment 
        image: vijaykammari/payment:v1
        imagePullPolicy: Always
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 11
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 1
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 1
        envFrom: 
        - configMapRef: 
            name: payment
        - secretRef: 
            name: payments