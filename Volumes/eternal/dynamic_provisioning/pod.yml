apiVersion: v1
kind: Pod
metadata:
  name: app
spec:
  containers:
  - name: nginx
    image: nginx
    volumeMounts:
    - name: persistent-storage
      mountPath: /usr/share/nginx/html/
  volumes:
  - name: persistent-storage
    persistentVolumeClaim:
      claimName: ebs-claim-dynamic

--- 

apiVersion: v1 
kind: Service 
metadata:
  name: nginx-headless
  labels: 
    project: roboshop
    component: shipping 
    tier: frontend
spec: 
  clusterIp: None
  selector: 
    project: roboshop
    component: shipping 
    tier: frontend
  ports: 
  - protocol: TCP 
    port: 80
    targetPort: 80

---

apiVersion: v1 
kind: Service 
metadata:
  name: nginx
  labels: 
    project: roboshop
    component: shipping 
    tier: frontend
spec: 
  selector: 
    project: roboshop
    component: shipping 
    tier: frontend
  ports: 
  - protocol: TCP 
    port: 80
    targetPort: 80

---  

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nginx
spec:
  selector:
    matchLabels:
      project: roboshop
      component: shipping 
      tier: frontend # has to match .spec.template.metadata.labels
  serviceName: "nginx-headless" # headless service name should be provided here
  replicas: 3 # by default is 1
  template:
    metadata:
      labels:
        project: roboshop
      component: shipping 
      tier: frontend # has to match .spec.selector.matchLabels
    spec:
      containers:
      - name: nginx
        image: nginx
        ports:
        - containerPort: 80
          name: web
        volumeMounts:
        - name: www
          mountPath: /usr/share/nginx/html
  volumeClaimTemplates: # this is pvc 
  - metadata:
      name: www
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-sc"
      resources:
        requests:
          storage: 1Gi

# So here no need to give nodeselector because , where the pod is created in that 
# avz the storageclass will create the requested ebs storage.
# https://github.com/kubernetes-sigs/aws-ebs-csi-driver/blob/master/examples/kubernetes/dynamic-provisioning/manifests/pod.yaml