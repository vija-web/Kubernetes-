apiVersion: v1 
kind: ConfigMap
metadata: 
  name: payment 
  namespace: roboshop 
data: 
  CART_HOST: "cart" 
  CART_PORT: "8080"
  USER_HOST: "user" 
  USER_PORT: "8080"
  AMQP_HOST: "rabbitmq"
  
---

apiVersion: v1
kind: Secret
metadata:
  name: payments
  namespace: roboshop
data:
  AMQP_USER: "cm9ib3Nob3AK"
  AMQP_PASS: "cm9ib3Nob3AxMjMK"


---
apiVersion: apps/v1 
kind: Deployment 
metadata: 
  name: payment
  namespace: roboshop
  labels: 
    project: roboshop
    component: payment 
    tier: application 
spec: 
  replicas: 1 
  selector: 
    matchLabels: 
      project: roboshop
      component: payment 
      tier: application
  template: 
    metadata: 
      labels: 
        project: roboshop
        component: payment 
        tier: application
    spec: 
      containers: 
      - name: payment 
        image: vijaykammari/payment:v1
        imagePullPolicy: Always
        livenessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 11
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 1
        readinessProbe:
          tcpSocket:
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          failureThreshold: 1
        envFrom: 
        - configMapRef: 
            name: payment
        - secretRef: 
            name: payments

--- 

apiVersion: v1 
kind: Service 
metadata:
  name: payment
  namespace: roboshop
  labels: 
    project: roboshop
    component: payment 
    tier: application
spec: 
  selector: 
    project: roboshop
    component: payment 
    tier: application
  ports: 
  - protocol: TCP 
    port: 8080
    targetPort: 8080

---

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: payment-hpa
  namespace: roboshop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: payment
  minReplicas: 1
  maxReplicas: 5 #70 in the real projects
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 5